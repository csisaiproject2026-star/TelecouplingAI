# NOTE: upstreams are resolved at REQUEST time via Docker's embedded DNS, not
# cached at startup. Using a variable in proxy_pass forces re-resolution (valid=10s),
# so when a container (e.g. api-server) is recreated and gets a new IP, nginx picks
# it up automatically within 10s — no more 502 after `docker compose up -d`, and no
# need to restart nginx. (Static `upstream {}` blocks cache the IP forever → stale.)

server {
    listen 80;
    # HTTPS for public access via MSU WAF (WAF terminates public TLS, connects to
    # this origin over 443). Self-signed cert is sufficient for the WAF→origin leg.
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Docker embedded DNS; re-resolve container names every 10s (no permanent cache)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream targets as variables → proxy_pass re-resolves them per request
    set $backend    "api-server:8000";
    set $frontend   "frontend-ui:80";
    set $fileserver "file-server:80";

    # Frontend static files
    location / {
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE streaming (no buffering) — 500M to allow file uploads with chat
    location /api/chat {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        client_max_body_size 500M;
        proxy_set_header X-Session-ID $http_x_session_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # File upload
    location /api/upload {
        proxy_pass http://$backend;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }

    # Other API routes
    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        proxy_pass http://$backend;
    }

    # File download — proxy to file-server container (avoids exposing port 8001).
    # location prefix /download/ already matches the upstream path, so the no-URI
    # variable form forwards the request URI unchanged.
    location /download/ {
        proxy_pass http://$fileserver;
        proxy_set_header Host $host;
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition 'attachment' always;
    }
}
