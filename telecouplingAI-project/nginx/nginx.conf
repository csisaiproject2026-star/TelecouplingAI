upstream backend    { server api-server:8000; }
upstream frontend   { server frontend-ui:80; }
upstream fileserver { server file-server:80; }

server {
    listen 80;
    # HTTPS for public access via MSU WAF (WAF terminates public TLS, connects to
    # this origin over 443). Self-signed cert is sufficient for the WAF→origin leg.
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend static files
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE streaming (no buffering) — 500M to allow file uploads with chat
    location /api/chat {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        client_max_body_size 500M;
        proxy_set_header X-Session-ID $http_x_session_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # File upload
    location /api/upload {
        proxy_pass http://backend;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }

    # Other API routes
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        proxy_pass http://backend;
    }

    # File download — proxy to file-server container (avoids exposing port 8001)
    location /download/ {
        proxy_pass http://fileserver/download/;
        proxy_set_header Host $host;
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition 'attachment' always;
    }
}
